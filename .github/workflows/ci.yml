name: Gatework CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'
      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Check package metadata
        run: cabal check
      - name: Build the package
        run: cabal build all --enable-tests
      - name: Run the test suite
        run: cabal test --enable-tests
      - name: Run the counter demo
        run: cabal run gatework -- --netlist fixtures/counter.net --duration 8 --output /tmp/counter.vcd
      - name: Compare the counter demo with the golden file
        run: diff fixtures/counter.golden.vcd /tmp/counter.vcd
      - name: Run the waveform report demo
        run: cabal run gatework -- report --netlist fixtures/counter.net --duration 8 --output /tmp/counter.report
      - name: Compare the report demo with the golden file
        run: diff fixtures/counter.golden.report /tmp/counter.report
      - name: Run the register demo
        run: cabal run gatework -- --netlist fixtures/register.net --duration 8 --output /tmp/register.vcd --set d=1 --at 2 d=0 --at 4 d=1 --at 6 d=0
      - name: Compare the register demo with the golden file
        run: diff fixtures/register.golden.vcd /tmp/register.vcd
      - name: Run the reset demo
        run: cabal run gatework -- --netlist fixtures/reset.net --duration 8 --output /tmp/reset.vcd --set d=1 --at 2 rst=1 --at 4 rst=0 --at 6 d=0
      - name: Compare the reset demo with the golden file
        run: diff fixtures/reset.golden.vcd /tmp/reset.vcd
      - name: Run the two-bit register demo
        run: cabal run gatework -- --netlist fixtures/reg2.net --duration 10 --output /tmp/reg2.vcd --set d0=1,d1=0 --at 4 d0=0,d1=1 --at 6 rst=1 --at 8 rst=0,d0=1,d1=1
      - name: Compare the two-bit register demo with the golden file
        run: diff fixtures/reg2.golden.vcd /tmp/reg2.vcd
      - name: Run the gate demo
        run: cabal run gatework -- --netlist fixtures/gates.net --duration 7 --output /tmp/gates.vcd --set a=0,b=1 --at 2 a=1,b=1 --at 4 a=1,b=0 --at 6 a=0,b=0
      - name: Compare the gate demo with the golden file
        run: diff fixtures/gates.golden.vcd /tmp/gates.vcd
      - name: Run the hierarchical adder demo
        run: cabal run gatework -- --netlist fixtures/haddader.net --duration 0 --output /tmp/haddader.vcd --set a0=1,a1=1,a2=0,a3=0,b0=1,b1=0,b2=1,b3=0,cin=0
      - name: Compare the hierarchical adder demo with the golden file
        run: diff fixtures/haddader.golden.vcd /tmp/haddader.vcd
      - name: Run the hierarchical counter demo
        run: cabal run gatework -- --netlist fixtures/hcounter.net --duration 8 --output /tmp/hcounter.vcd
      - name: Compare the hierarchical counter demo with the golden file
        run: diff fixtures/hcounter.golden.vcd /tmp/hcounter.vcd
      - name: Run the assertion demo
        run: cabal run gatework -- --netlist fixtures/assert.net --duration 6 --output /tmp/assert.vcd --set a=0,b=1 --at 3 a=1 --at 5 a=0
      - name: Compare the assertion demo with the golden file
        run: diff fixtures/assert.golden.vcd /tmp/assert.vcd
      - name: Run the adder demo
        run: cabal run gatework -- --netlist fixtures/adder.net --duration 0 --output /tmp/adder.vcd --set a0=1,a1=1,a2=0,a3=0,b0=1,b1=0,b2=1,b3=0,cin=0
      - name: Compare the adder demo with the golden file
        run: diff fixtures/adder.golden.vcd /tmp/adder.vcd
      - name: Run the tri-state demo
        run: cabal run gatework -- --netlist fixtures/tristate.net --duration 8 --output /tmp/tristate.vcd --set d=0,en=0 --at 2 en=1 --at 4 d=1 --at 6 en=0
      - name: Compare the tri-state demo with the golden file
        run: diff fixtures/tristate.golden.vcd /tmp/tristate.vcd
      - name: Run the undefined demo
        run: cabal run gatework -- --netlist fixtures/unknown.net --duration 8 --output /tmp/unknown.vcd --set d=1 --at 4 d=0
      - name: Compare the undefined demo with the golden file
        run: diff fixtures/unknown.golden.vcd /tmp/unknown.vcd
      - name: Run the bus demo with whole-bus values
        run: cabal run gatework -- --netlist fixtures/bus.net --duration 3 --output /tmp/bus.vcd --set a=0101,b=1010
      - name: Compare the bus demo with the golden file
        run: diff fixtures/bus.golden.vcd /tmp/bus.vcd
      - name: Run the shared bus demo
        run: cabal run gatework -- --netlist fixtures/shared.net --duration 8 --output /tmp/shared.vcd --set d0=0,e0=0,d1=1,e1=0 --at 2 e0=1 --at 4 e1=1 --at 6 e0=0
      - name: Compare the shared bus demo with the golden file
        run: diff fixtures/shared.golden.vcd /tmp/shared.vcd
      - name: Run the library adder demo
        run: cabal run gatework -- --netlist fixtures/libadder.net --library fixtures/adderlib.net --duration 0 --output /tmp/libadder.vcd --set a0=1,a1=1,a2=0,a3=0,b0=1,b1=0,b2=1,b3=0,cin=0
      - name: Compare the library adder demo with the golden file
        run: diff fixtures/libadder.golden.vcd /tmp/libadder.vcd
      - name: Confirm a missing library file stops the run
        run: |
          if cabal run gatework -- --netlist fixtures/libadder.net --library fixtures/missing.net --duration 0 --output /tmp/none.vcd 2>/tmp/none.log; then
            echo "expected the missing library to fail"
            exit 1
          fi
          grep -q "cannot read library file: fixtures/missing.net" /tmp/none.log
      - name: Confirm a failed assertion stops the run
        run: |
          if cabal run gatework -- --netlist fixtures/assert.net --duration 6 --output /tmp/fail.vcd --set a=1,b=1 2>/tmp/fail.log; then
            echo "expected the assertion to fail"
            exit 1
          fi
          grep -q "assertion failed: y must be 1 at time 0" /tmp/fail.log
